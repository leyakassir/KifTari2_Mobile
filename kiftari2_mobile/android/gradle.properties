# 🔴 Disable Gradle background daemon (saves RAM)
org.gradle.daemon=false


# 🔴 Disable parallel builds (very important for low RAM)
org.gradle.parallel=false

# 🔴 Reduce Gradle memory usage
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8

# 🔴 Disable Kotlin incremental compilation (saves memory)
kotlin.incremental=false

# 🔴 Force Kotlin compiler to run in-process (less RAM spikes)
kotlin.compiler.execution.strategy=in-process

# 🔴 Disable Gradle build cache (avoids disk + memory pressure)
org.gradle.caching=false

# 🔴 Disable configure-on-demand
org.gradle.configureondemand=false

android.useAndroidX=true
android.enableJetifier=true
